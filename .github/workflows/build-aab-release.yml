name: Build Android AAB (Release)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete old AAB artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'qapqrv-release-aab';
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const artifact of data.artifacts.filter((item) => item.name === artifactName)) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              core.info(`Deleted old artifact: ${artifact.name} (${artifact.id})`);
            }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle
        run: bun run build

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi

      - name: Generate APK assets (icon + splash)
        run: bunx capacitor-assets generate --android || true

      - name: Capacitor sync
        run: bunx cap sync android

      - name: Install native Android plugins (VpnStatus + InAppWebView)
        run: bash android-plugin/install.sh

      - name: Patch AndroidManifest with AdMob APPLICATION_ID
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-4966192764194561~2515666476"/>\n    </application>#' "$MANIFEST"
          fi

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 nao configurado. Veja APK-BUILD.md."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/qapqrv-release.jks
          echo "Keystore decoded ($(stat -c%s android/app/qapqrv-release.jks) bytes)"

      - name: Patch build.gradle with signing config + version
        run: |
          GRADLE=android/app/build.gradle
          sed -i 's/versionCode [0-9][0-9]*/versionCode 1/'   "$GRADLE"
          sed -i 's/versionName "[^"]*"/versionName "1.0.0"/' "$GRADLE"
          if ! grep -q "signingConfigs {" "$GRADLE"; then
            python3 .github/scripts/patch-gradle-signing.py
          fi
          echo "--- build.gradle (preview) ---"
          sed -n '1,80p' "$GRADLE"



      - name: Build signed AAB (release)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secrets KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD nao configurados."
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: List output
        run: |
          echo "--- AAB gerado ---"
          ls -lh android/app/build/outputs/bundle/release/ || true

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: qapqrv-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
