name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Delete old APK/AAB artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const names = ['qapqrv-debug-apk', 'qapqrv-release-aab'];
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const artifact of data.artifacts.filter((item) => names.includes(item.name))) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              core.info(`Deleted old artifact: ${artifact.name} (${artifact.id})`);
            }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle
        run: bun run build

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi




      - name: Generate APK assets (icon + splash)
        run: bunx capacitor-assets generate --android || true

      - name: Capacitor sync
        run: bunx cap sync android

      - name: Install native Android plugins (VpnStatus + InAppWebView)
        run: bash android-plugin/install.sh

      - name: Patch AndroidManifest with AdMob APPLICATION_ID
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-4966192764194561~2515666476"/>\n    </application>#' "$MANIFEST"
          fi
          echo "--- AndroidManifest.xml ---"
          cat "$MANIFEST"



      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: List APK sizes
        run: |
          echo "--- APKs gerados ---"
          ls -lh android/app/build/outputs/apk/debug/ || true

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk-latest
          name: APK Debug Latest
          body: APK debug gerado automaticamente pelo workflow Build Android APK.
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/*.apk

      # ============================================================
      # AAB Release (Play Store) - roda no mesmo job, se os secrets
      # de assinatura existirem. Se faltarem, pula sem falhar o APK.
      # ============================================================
      - name: Check AAB signing secrets
        id: aab_secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets de assinatura ausentes - AAB nao sera gerado. Configure ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD em Settings > Secrets."
          fi

      - name: Decode signing keystore
        if: steps.aab_secrets.outputs.ok == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/qapqrv-release.jks
          echo "Keystore decoded ($(stat -c%s android/app/qapqrv-release.jks) bytes)"

      - name: Patch build.gradle with signing config + version
        if: steps.aab_secrets.outputs.ok == 'true'
        run: |
          GRADLE=android/app/build.gradle
          sed -i 's/versionCode [0-9][0-9]*/versionCode 4/'   "$GRADLE"
          sed -i 's/versionName "[^"]*"/versionName "1.1.2"/' "$GRADLE"
          if ! grep -q "signingConfigs {" "$GRADLE"; then
            python3 .github/scripts/patch-gradle-signing.py
          fi

      - name: Build signed AAB (release)
        if: steps.aab_secrets.outputs.ok == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: List AAB output
        if: steps.aab_secrets.outputs.ok == 'true'
        run: ls -lh android/app/build/outputs/bundle/release/ || true

      - name: Upload AAB artifact
        if: steps.aab_secrets.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: qapqrv-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 1
          compression-level: 9


      - name: Upload AAB to GitHub Release
        if: steps.aab_secrets.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-aab-latest
          name: AAB Release Latest
          body: AAB release gerado automaticamente pelo workflow Build Android APK.
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/bundle/release/*.aab
